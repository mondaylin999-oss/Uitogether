<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your UITogether notifications.">
  <meta name="theme-color" content="#32828D">
  <title>Notifications — UITogether</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="navbar"></div>

  <main id="main" class="container page">
    <div class="page-head">
      <h1>Notifications</h1>
      <p>Buddy requests, new events, lost &amp; found posts and polls — all in one place.</p>
    </div>

    <div class="row-between mb-4">
      <div class="row">
        <label class="sr-only" for="notif-filter">Filter notifications</label>
        <select class="select" id="notif-filter" style="width:auto;min-width:170px">
          <option value="">All notifications</option>
          <option value="unread">Unread only</option>
        </select>

        <label class="sr-only" for="notif-type">Filter by type</label>
        <select class="select" id="notif-type" style="width:auto;min-width:190px">
          <option value="">Any type</option>
          <option value="buddy_request">Buddy requests</option>
          <option value="buddy_request_accepted">Accepted requests</option>
          <option value="buddy_request_rejected">Declined requests</option>
          <option value="new_competition">New competitions</option>
          <option value="new_lost_found">Lost &amp; found</option>
          <option value="new_poll">New polls</option>
        </select>
      </div>

      <button type="button" class="btn btn-ghost" id="notif-mark-all">Mark all as read</button>
    </div>

    <div class="card">
      <div id="notif-list" aria-live="polite"></div>
    </div>

    <div class="row" style="justify-content:center;margin-top:18px">
      <button type="button" class="btn btn-ghost" id="notif-more" hidden>Load more</button>
    </div>
  </main>

  <footer class="footer container">
    <p>UITogether — Connect. Study. Grow Together.</p>
  </footer>

  <script src="../utils/dom.js"></script>
  <script src="../utils/format.js"></script>
  <script src="../utils/validate.js"></script>
  <script src="../components/toast.js"></script>
  <script src="../components/states.js"></script>
  <script src="../components/modal.js"></script>
  <script src="../components/tabs.js"></script>
  <script src="../components/confirm.js"></script>
  <script src="../services/api.js"></script>
  <script src="../auth/auth.js"></script>
  <script src="../auth/guard.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="notifications.js"></script>
</body>
</html>
